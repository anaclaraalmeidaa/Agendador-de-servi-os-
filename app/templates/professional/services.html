<section class="card"><h2>Serviços</h2>{% for s in professional.services %}<p>{{ s.name }} · {{ s.duration_minutes }} min</p><form method="post" action="/profissional/servicos/{{ s.id }}" hx-post="/profissional/servicos/{{ s.id }}"><input type="hidden" name="csrf_token" value="{{ csrf }}"><label>Nome<input name="name" value="{{ s.name }}" required></label><label>Duração (minutos)<input type="number" name="duration_minutes" value="{{ s.duration_minutes }}" min="1" required></label><button>Salvar</button></form>{% endfor %}<form method="post" action="/profissional/servicos" hx-post="/profissional/servicos"><input type="hidden" name="csrf_token" value="{{ csrf }}"><label>Novo serviço<input name="name" required></label><label>Duração em minutos<input type="number" name="duration_minutes" min="1" required></label><button>Adicionar serviço</button></form></section>
