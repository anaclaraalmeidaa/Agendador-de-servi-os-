<section class="card"><h2>Horários de atendimento</h2>{% for p in professional.periods %}<form method="post" action="/profissional/horarios/{{ p.id }}" hx-post="/profissional/horarios/{{ p.id }}"><input type="hidden" name="csrf_token" value="{{ csrf }}"><label>Dia<select name="weekday">{% for num,name in [(1,'Segunda'),(2,'Terça'),(3,'Quarta'),(4,'Quinta'),(5,'Sexta'),(6,'Sábado'),(7,'Domingo')] %}<option value="{{ num }}" {% if p.weekday == num %}selected{% endif %}>{{ name }}</option>{% endfor %}</select></label><label>Abertura<input type="time" name="opens_at" value="{{ p.opens_at.strftime('%H:%M') }}" required></label><label>Fechamento<input type="time" name="closes_at" value="{{ p.closes_at.strftime('%H:%M') }}" required></label><button>Salvar horário</button></form>{% endfor %}<form method="post" action="/profissional/horarios" hx-post="/profissional/horarios"><input type="hidden" name="csrf_token" value="{{ csrf }}"><label>Dia da semana<select name="weekday">{% for num,name in [(1,'Segunda'),(2,'Terça'),(3,'Quarta'),(4,'Quinta'),(5,'Sexta'),(6,'Sábado'),(7,'Domingo')] %}<option value="{{ num }}">{{ name }}</option>{% endfor %}</select></label><label>Abertura<input type="time" name="opens_at" required></label><label>Fechamento<input type="time" name="closes_at" required></label><button>Adicionar horário</button></form></section>
