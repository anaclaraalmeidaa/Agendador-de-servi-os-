<form method="post" action="/p/{{ slug }}/appointments"><input type="hidden" name="csrf_token" value="{{ csrf }}"><input type="hidden" name="service_id" value="{{ service.id }}"><label>Horário<select name="starts_at" required>{% for value,label in slot_options %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></label><label>Seu nome<input name="client_name" maxlength="120" autocomplete="name" required></label><label>Telefone<input name="client_phone" type="tel" maxlength="30" autocomplete="tel" required></label><button>Confirmar agendamento</button></form>
